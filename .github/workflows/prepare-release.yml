name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  actions: write
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          install-dependencies: 'false'

      - name: Configure Git identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"

      - name: Bump version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          pnpm version "$BUMP" --json --message "release: v%s"
          echo "tag=v$(jq --raw-output .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Push release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git push --atomic origin "HEAD:$DEFAULT_BRANCH" "refs/tags/$TAG"

      - name: Start publishing
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run publish-release.yml --ref "$DEFAULT_BRANCH" --field tag="$TAG"
